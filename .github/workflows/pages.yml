name: Publish site

# main goes to the site root, redesign to /redesign/.
# The file lives on redesign, so redesign pushes (or a manual
# run) rebuild both copies. main itself is never modified here.

on:
  push:
    branches:
      - redesign
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main for the site root
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out redesign for the preview
        uses: actions/checkout@v4
        with:
          ref: redesign
          path: redesign

      - name: Assemble the published tree
        run: |
          mkdir -p _site/redesign
          # only tracked repo files may reach the public site
          tar --exclude='./.git' --exclude='./.github' --exclude='./rules.md' -C main -cf - . | tar -C _site -xf -
          tar --exclude='./.git' --exclude='./.github' --exclude='./rules.md' -C redesign -cf - . | tar -C _site/redesign -xf -

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
