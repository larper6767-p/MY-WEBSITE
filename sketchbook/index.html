<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketchbook — carpediemsnutz</title>
<meta name="description" content="A sketchbook of paintings, prints and notes. Flip through it page by page.">

<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/sketchbook.css?v=5">
</head>
<body>

<div class="desk">

  <!-- Shared nav: repeated in every HTML file so pages work without JS.
       Sketchbook marks 03 Beyond as current; links are relative to the
       site root because the preview runs under a subpath. -->
  <nav class="site-nav" aria-label="Main">
    <p class="site-nav-word">carpediemsnutz</p>
    <ul class="site-nav-list">
      <li><a href="../">01 Home</a></li>
      <li><a href="../#about">02 About</a></li>
      <li><a href="../#beyond" aria-current="page">03 Beyond</a></li>
    </ul>
  </nav>

  <header class="masthead">
    <h1 class="masthead-name" data-fill="identity/name">carpediemsnutz</h1>
    <p class="masthead-kicker" data-fill="strings/kicker"></p>
  </header>

  <div class="layout">

    <aside class="rail">
      <p class="rail-title" id="rail-title">Contents</p>
      <ol class="rail-list" id="contents"></ol>
    </aside>

    <div class="book-column">
      <div class="book-stage">
        <div id="book" aria-label="Sketchbook"></div>
      </div>

      <div class="controls">
        <button class="btn" id="btn-prev" type="button">Back</button>
        <p class="counter" aria-live="polite">
          <span id="counter-page">Cover</span>
          <span class="counter-works" id="counter-works"></span>
        </p>
        <button class="btn" id="btn-next" type="button">Turn</button>
      </div>

      <p class="hint">Click a page, drag a corner, or use the arrow keys.</p>

      <p class="next-strip">
        <a class="next-strip-link" href="../#beyond">
          <span class="next-strip-num">Back to</span>
          <span>03 Beyond</span>
        </a>
      </p>
    </div>

  </div>

  <footer class="footer">
    <p class="footer-line">[PLACEHOLDER: copyright line]</p>
    <div class="footer-social" id="social" aria-label="Social media"></div>
  </footer>

  <p class="notice" id="notice" hidden></p>

  <noscript>
    <p class="notice">This sketchbook is assembled in the browser. Turn JavaScript on to flip through it.</p>
  </noscript>

</div>

<script src="../vendor/page-flip/page-flip.browser.min.js"></script>
<script src="../js/sketchbook.js?v=8"></script>
</body>
</html>
